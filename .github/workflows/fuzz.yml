name: Fuzz

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz config package
        run: |
          go test -fuzz=FuzzParseBool -fuzztime=30s ./internal/config/
          go test -fuzz=FuzzGetEnvDefault -fuzztime=30s ./internal/config/
