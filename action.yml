name: SBOMForge
description: Automatically generates a signed SBOM using Syft and Cosign, and attaches it to your GitHub releases.

branding:
  icon: shield
  color: green

inputs:
  github-token:
    description: GitHub token to upload the SBOM as a release asset.
    required: true
  format:
    description: 'SBOM format(s). One or more of: spdx-json, cyclonedx-json, syft-json. Comma-separated for multiple (e.g. "spdx-json,cyclonedx-json").'
    required: false
    default: spdx-json
  artifact-name:
    description: Output filename prefix.
    required: false
    default: sbom
  sign:
    description: Sign the SBOM with Cosign keyless
    required: false
    default: "true"
  attach-to-release:
    description: Attach the SBOM to the GitHub Release.
    required: false
    default: "true"
  upload-to-summary:
    description: Show a summary in the GitHub Actions Job Summary.
    required: false
    default: "true"
  scan-path:
    description: 'Directory or directories to scan. Comma-separated for monorepos (e.g. "services/api,services/worker"). If image is set, this is ignored.'
    required: false
    default: .
  image:
    description: Docker image to scan (e.g. alpine:3.21,ghcr.io/org/app:latest). If set, scan-path is ignored.
    required: false
    default: ""
  fail-on-error:
    description: Fail the job if SBOM generation fails.
    required: false
    default: "true"
  dry-run:
    description: Generate the SBOM without signing or uploading. Useful for testing.
    required: false
    default: "false"
  attest:
    description: Generate a signed SLSA provenance attestation for each SBOM. Requires id-token:write permission.
    required: false
    default: "false"
  oci-image:
    description: 'OCI image reference to attach the SBOM to (e.g. ghcr.io/org/app@sha256:...). Requires prior login with docker/login-action. If set, the SBOM is attached to the image in the registry.'
    required: false
    default: ""

outputs:
  sbom-path:
    description: 'Local path(s) of the generated SBOM file(s). Comma-separated when multiple formats are used.'
  sbom-url:
    description: 'Download URL(s) of the SBOM(s) on the GitHub Release. Comma-separated when multiple formats are used.'
  signature-bundle:
    description: 'Path(s) to the Cosign signature bundle(s). Comma-separated when multiple formats are used.'

runs:
  using: docker
  image: Dockerfile
